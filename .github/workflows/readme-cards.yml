name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Compiler Explorer pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=compiler-explorer&repo=compiler-explorer
          path: profile/pin-compiler-explorer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate jsbeeb pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mattgodbolt&repo=jsbeeb
          path: profile/pin-jsbeeb.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
